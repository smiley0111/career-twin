# Render Blueprint (基础设施即代码).
# 在 Render 控制台选 "New +" -> "Blueprint" -> 连 GitHub 仓库, 它会读这个文件自动建服务.
#
# 密钥类 (sync: false) 不写进仓库, 首次部署时在 Render 网页手动填一次.
services:
  - type: web
    name: career-twin-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- 主力模型 (DeepSeek) ---
      - key: DEEPSEEK_API_KEY
        sync: false               # 密钥, 网页手填
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      # --- Embedding (硅基流动 API) ---
      - key: EMBEDDING_PROVIDER
        value: api
      - key: EMBEDDING_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: EMBEDDING_API_KEY
        sync: false               # 密钥, 网页手填
      - key: EMBEDDING_MODEL
        value: BAAI/bge-m3
      - key: EMBEDDING_DIM
        value: "1024"
      # --- CORS (前端 Vercel 域名, 拿到后再填) ---
      - key: CORS_ORIGINS
        sync: false
